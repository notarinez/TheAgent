<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#7b5cff">
  <meta name="description" content="Tu muñeco de notas por voz">
  <title>TheAgent</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/buddy.css">
</head>
<body>
  <main id="app">
    <!-- AGENTE -->
    <section class="view" id="view-home" data-view="home">
      <header class="home-top">
        <span class="pill" id="key-pill">Sin API</span>
        <button class="pill warn hidden" id="queue-pill"></button>
      </header>
      <div class="stage">
        <div class="bubble" id="bubble">Hola 👋</div>
        <div class="buddy-wrap" id="buddy"></div>
        <div class="meter"><span id="meter-bar"></span></div>
      </div>
      <div class="controls">
        <button class="round" id="btn-type" aria-label="Escribir">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg>
        </button>
        <button class="main-btn" id="btn-main"><span class="dot"></span><span class="lbl">Escuchar</span></button>
        <button class="round" id="btn-cancel" aria-label="Descartar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <form class="type-box hidden" id="type-box" autocomplete="off">
        <input id="type-input" placeholder="Escríbeme algo…" enterkeyhint="send">
        <button class="btn primary">Enviar</button>
      </form>
      <div class="recent" id="recent"></div>
    </section>

    <section class="view" id="view-notes" data-view="notes"></section>
    <section class="view" id="view-calendar" data-view="calendar"></section>
    <section class="view" id="view-settings" data-view="settings"></section>
  </main>

  <nav class="tabs">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><circle cx="9" cy="12" r="1.2" class="f"/><circle cx="15" cy="12" r="1.2" class="f"/><path d="M9.5 16q2.5 2 5 0"/></svg>
      <span>Agente</span>
    </a>
    <a href="#notes" data-tab="notes">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/></svg>
      <span>Notas</span>
    </a>
    <a href="#calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Calendario</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
